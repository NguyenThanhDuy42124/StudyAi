[project]
name = "app"
version = "0.1.0"
description = "AI Student Assistant Backend"
requires-python = ">=3.14,<4.0"
dependencies = [
    # ── Web Framework
    "fastapi[standard]>=0.141.1,<1.0.0",
    "python-multipart<1.0.0,>=0.0.27",
    "email-validator<3.0.0.0,>=2.1.0.post1",
    "pydantic>2.0",
    "pydantic-settings<3.0.0,>=2.2.1",
    # ── Database
    "alembic<2.0.0,>=1.12.1",
    "sqlmodel>=0.0.39,<1.0.0",
    "psycopg[binary]>=3.3.4,<4.0.0",
    # ── Auth
    "pyjwt<3.0.0,>=2.13.0",
    "pwdlib[argon2,bcrypt]>=0.3.0",
    # ── HTTP & Email
    "httpx<1.0.0,>=0.25.1",
    "emails>=1.1.2,<2.0",
    "jinja2<4.0.0,>=3.1.4",
    # ── AI Providers
    "google-genai>=1.0.0",
    "openai>=1.0.0",
    # ── Vector Database
    "qdrant-client>=1.13.0",
    # ── Document Parsing
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.21",
    # ── Utilities
    "loguru>=0.7.0",
    "slowapi>=0.1.9",
    "psutil>=6.0.0",
    "sentry-sdk[fastapi]>=2.66.1,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest<10.0.0,>=7.4.3",
    "pytest-asyncio>=0.23.0",
    "mypy<3.0.0,>=1.8.0",
    "ruff<1.0.0,>=0.2.2",
    "coverage<8.0.0,>=7.4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]

[tool.ruff]
target-version = "py314"
exclude = ["alembic"]

[tool.ruff.lint]
select = ["E","W","F","I","B","C4","UP"]
ignore = ["E501","B008","W191","B904"]

[tool.coverage.run]
source = ["app"]

[tool.fastapi]
entrypoint = "app.main:app"
